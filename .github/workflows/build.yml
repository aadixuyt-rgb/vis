name: Build GreenGlow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build mod
        run: gradle --no-daemon clean build
      - name: Verify Fabric metadata is inside the mod JAR
        shell: bash
        run: |
          mod_jar="$(find build/libs -maxdepth 1 -name 'GreenGlow-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$mod_jar"
          jar tf "$mod_jar" | grep -qx 'fabric.mod.json'
          jar tf "$mod_jar" | grep -qx 'greenglow.mixins.json'
      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: GreenGlow-${{ github.sha }}
          path: |
            build/libs/GreenGlow-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
